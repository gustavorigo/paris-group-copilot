name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um PR atualizado cancela a execução anterior: não adianta terminar
# a checagem de um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Autenticar no GitHub Packages
        # O PageShell é pacote privado da organização. O token automático
        # do GitHub só vale para este repositório, então a leitura de
        # pacotes de outra org exige um token próprio, guardado em secret.
        run: |
          echo "@parisgroup-ai:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PG_PACKAGES_TOKEN }}" >> .npmrc

      - name: Instalar dependências
        # npm ci respeita o package-lock.json: a CI instala exatamente
        # as mesmas versões que rodam na máquina de quem desenvolve.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
